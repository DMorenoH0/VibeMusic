name: Build and publish VibeMusic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;36.0.0"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      # Builds a release APK signed with the same stable keystore on every run
      # when the repository secrets are configured. Without secrets it falls
      # back to a debug APK so the workflow still produces an installable file.
      - name: Build APK
        id: build
        env:
          VIBE_KEYSTORE_BASE64: ${{ secrets.VIBE_KEYSTORE_BASE64 }}
          VIBE_KEYSTORE_PASSWORD: ${{ secrets.VIBE_KEYSTORE_PASSWORD }}
          VIBE_KEY_ALIAS: ${{ secrets.VIBE_KEY_ALIAS }}
          VIBE_KEY_PASSWORD: ${{ secrets.VIBE_KEY_PASSWORD }}
          VIBE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VIBE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          chmod +x ./gradlew
          if [ -n "$VIBE_KEYSTORE_BASE64" ]; then
            echo "$VIBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vibemusic.keystore"
            export VIBE_KEYSTORE_PATH="$RUNNER_TEMP/vibemusic.keystore"
            echo "Compilando release firmado con keystore estable."
            ./gradlew --no-daemon assembleRelease
            SOURCE="app/build/outputs/apk/release/app-release.apk"
          else
            echo "Sin secretos de firma: compilando APK debug."
            ./gradlew --no-daemon assembleDebug
            SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -f "$SOURCE"
          mkdir -p release
          cp "$SOURCE" release/VibeMusic.apk
          ls -l release/VibeMusic.apk

          # El metadato lo escribe AGP junto al APK: así el tag y el nombre de
          # la release siempre coinciden con la versión realmente compilada.
          META="$(dirname "$SOURCE")/output-metadata.json"
          test -f "$META"
          VERSION=$(jq -r '.elements[0].versionName' "$META")
          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$META")
          test -n "$VERSION" && test "$VERSION" != "null"
          echo "Versión compilada: $VERSION ($VERSION_CODE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256
        id: hash
        run: |
          SHA=$(sha256sum release/VibeMusic.apk | awk '{print $1}')
          echo "value=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ -x "${APKSIGNER}.bat" ]; then APKSIGNER="${APKSIGNER}.bat"; fi
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs release/VibeMusic.apk
          else
            echo "apksigner no disponible; se omite la comprobación local."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: VibeMusic v${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Instalador Android de VibeMusic v${{ steps.build.outputs.version }}
            (versionCode ${{ steps.build.outputs.version_code }}).

            **SHA-256 del APK:** `${{ steps.hash.outputs.value }}`

            Descarga **VibeMusic.apk** y ábrelo en tu dispositivo Android.
            VibeMusic comprueba este hash antes de ofrecer la instalación.

            Novedades:
            - Buscador con catálogo público de Deezer (vistas previas oficiales de 30 s).
            - Bibliotecas separadas: dispositivo, descargas e importados.
            - Importación y exportación de listas en CSV.
            - Temas visuales: AMOLED, Midnight, Ocean, Purple, Crimson, Emerald y Light.
            - Comprobación de actualizaciones desde GitHub Releases.
            - Privacidad: documentos legales y eliminación de datos locales.
            - Inicio de sesión opcional con Google Identity Services.

            **Firma:** a partir de v1.1.0 se usa un keystore estable, por lo que
            las próximas actualizaciones serán compatibles entre sí. La versión
            1.0.2 se firmó con un keystore debug efímero del runner de CI y su
            clave no se conserva; si vienes de ella, desinstala una vez antes de
            instalar esta versión.

            El inicio de sesión con Google solo está activo si se define el
            secreto `VIBE_GOOGLE_WEB_CLIENT_ID`.
          files: release/VibeMusic.apk
          draft: false
          prerelease: false
          make_latest: true
