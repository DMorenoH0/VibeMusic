name: Build and publish VibeMusic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;36.0.0"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      # Builds a release APK signed with the same stable keystore on every run
      # when the repository secrets are configured. Without secrets it falls
      # back to a debug APK so the workflow still produces an installable file.
      - name: Build APK
        id: build
        env:
          VIBE_KEYSTORE_BASE64: ${{ secrets.VIBE_KEYSTORE_BASE64 }}
          VIBE_KEYSTORE_PASSWORD: ${{ secrets.VIBE_KEYSTORE_PASSWORD }}
          VIBE_KEY_ALIAS: ${{ secrets.VIBE_KEY_ALIAS }}
          VIBE_KEY_PASSWORD: ${{ secrets.VIBE_KEY_PASSWORD }}
          VIBE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VIBE_GOOGLE_WEB_CLIENT_ID }}
          VIBE_YOUTUBE_API_KEY: ${{ secrets.VIBE_YOUTUBE_API_KEY }}
        run: |
          chmod +x ./gradlew
          if [ -n "$VIBE_KEYSTORE_BASE64" ]; then
            echo "$VIBE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vibemusic.keystore"
            export VIBE_KEYSTORE_PATH="$RUNNER_TEMP/vibemusic.keystore"
            echo "Compilando release firmado con keystore estable."
            ./gradlew --no-daemon assembleRelease
            SOURCE="app/build/outputs/apk/release/app-release.apk"
          else
            echo "Sin secretos de firma: compilando APK debug."
            ./gradlew --no-daemon assembleDebug
            SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -f "$SOURCE"
          mkdir -p release
          cp "$SOURCE" release/VibeMusic.apk
          ls -l release/VibeMusic.apk

          # El metadato lo escribe AGP junto al APK: así el tag y el nombre de
          # la release siempre coinciden con la versión realmente compilada.
          META="$(dirname "$SOURCE")/output-metadata.json"
          test -f "$META"
          VERSION=$(jq -r '.elements[0].versionName' "$META")
          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$META")
          test -n "$VERSION" && test "$VERSION" != "null"
          echo "Versión compilada: $VERSION ($VERSION_CODE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256
        id: hash
        run: |
          SHA=$(sha256sum release/VibeMusic.apk | awk '{print $1}')
          echo "value=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      - name: Package source and checksum
        run: |
          cd "$GITHUB_WORKSPACE"
          VERSION="${{ steps.build.outputs.version }}"
          echo "${{ steps.hash.outputs.value }}  VibeMusic.apk" > release/VibeMusic.apk.sha256
          zip -r "release/VibeMusic-${VERSION}-source.zip" . \
            -x ".git/*" ".gradle/*" ".idea/*" "*/build/*" "build/*" "release/*" \
               "local.properties" "*.log" "*.jks" "*.keystore"
          ls -l release

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ -x "${APKSIGNER}.bat" ]; then APKSIGNER="${APKSIGNER}.bat"; fi
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs release/VibeMusic.apk
          else
            echo "apksigner no disponible; se omite la comprobación local."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: VibeMusic v${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Instalador Android de VibeMusic v${{ steps.build.outputs.version }}
            (versionCode ${{ steps.build.outputs.version_code }}).

            SHA-256 del APK:
            ${{ steps.hash.outputs.value }}

            Descarga VibeMusic.apk y ábrelo en tu dispositivo Android.
            VibeMusic comprueba este hash antes de ofrecer la instalación.
            También se adjuntan el archivo de suma SHA-256 y el código fuente
            limpio en VibeMusic-${{ steps.build.outputs.version }}-source.zip
            (sin build, .git ni secretos).

            Novedades de VibeMusic 3.1:
            - Importador de playlists de Spotify y YouTube Music en Explorar → Descargas → «Importar playlist», con detección de plataforma, progreso y cancelación.
            - Spotify mediante su API oficial (client credentials con credenciales propias del usuario, cifradas con Android Keystore) y YouTube Music mediante YouTube Data API v3, con paginación completa y sin extraer audio de ninguna de las dos plataformas.
            - Coincidencias reales en Audius con puntuación por título, artista, versión (remix, slowed, instrumental, directo, cover, etc.), duración, álbum e ISRC; las versiones incompatibles se rechazan y las dudosas requieren confirmación.
            - Estados Disponible, Descargable, Local, Coincidencia dudosa, No encontrada y No disponible; selección individual o múltiple y añadido parcial a la biblioteca conservando el orden y los metadatos originales.
            - Migración aditiva de Room 3 → 4 que conserva favoritos, listas, historial y descargas.
            - 143 pruebas unitarias y 2 pruebas instrumentadas de migración ejecutadas en emulador API 37.

            Se mantienen las funciones de 3.0 y 2.x: cinco pestañas, «Para ti» local, buscador unificado con Audius y Deezer, artistas, álbumes y listas de Audius, descargas reanudables, biblioteca offline, perfiles de audio, ecualizador con 12 presets y listas.

            Limitaciones honestas:
            - Importar una playlist real necesita credenciales propias de Spotify o una clave válida de YouTube Data API v3; sin ellas la app lo explica y no inventa resultados.
            - Las coincidencias dependen del catálogo público de Audius; una canción no publicada allí aparece como «No encontrada».
            - Las vistas previas de Deezer tienen licencia de reproducción, no de descarga, y se muestran como no disponibles.
            - Audius requiere conexión para streaming; sin conexión solo se reproducen las descargas autorizadas.
            - No se procesan pagos ni se eluden condiciones de acceso de Audius.
            - Tuned Global no está conectado; la interfaz de proveedores está preparada para una futura integración.
            - El ecualizador depende de que el fabricante exponga efectos globales; si no, la app lo indica.
            - El códec Bluetooth y el modelo exacto no son APIs públicas; no se inventan.
            - Probado en emulador API 37; no hay pruebas en teléfono físico ni con dispositivos Bluetooth reales.
            - La búsqueda de YouTube necesita una clave válida o un proxy; sin ellas muestra «Configuración pendiente».

            Firma: esta versión usa el mismo keystore estable que v1.1.0, por lo
            que se instala como actualización normal. La versión 1.0.2 se firmó
            con un keystore debug efímero del runner de CI y su clave no se
            conserva; si vienes de ella, desinstala una vez antes de instalar.
          files: |
            release/VibeMusic.apk
            release/VibeMusic.apk.sha256
            release/VibeMusic-${{ steps.build.outputs.version }}-source.zip
          draft: false
          prerelease: false
          make_latest: true
